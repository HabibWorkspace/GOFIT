<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, proxy-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="version" content="BUILD_TIMESTAMP" />
    <link rel="icon" type="image/png" href="/logo-optimized.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2C228" />
    <meta name="description" content="GOFIT - Gym Management System" />
    <title>GOFIT - Gym Management</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Critical resource hints -->
    <link rel="preconnect" href="https://web.go-fit.me" crossorigin />
    <link rel="dns-prefetch" href="https://web.go-fit.me" />
    <!-- Inline critical CSS for instant render -->
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#111827;color:#f5f5f5;min-height:100vh;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
      .min-h-screen{min-height:100vh}
      .flex{display:flex}
      .items-center{align-items:center}
      .justify-center{justify-content:center}
      .bg-gradient-to-br{background-image:linear-gradient(to bottom right,var(--tw-gradient-stops))}
      .from-gray-900{--tw-gradient-from:#111827;--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to,rgba(17,24,39,0))}
      .via-gray-800{--tw-gradient-stops:var(--tw-gradient-from),#1f2937,var(--tw-gradient-to,rgba(31,41,55,0))}
      .to-gray-900{--tw-gradient-to:#111827}
    </style>
    <script>
      console.log('🚀 App initialization started');
      
      // Check authentication BEFORE any cache clearing
      const hasToken = localStorage.getItem('token');
      const hasUser = localStorage.getItem('user');
      
      console.log('🔐 Auth check:', { hasToken: !!hasToken, hasUser: !!hasUser });
      
      // Only redirect to login-fast.html if NOT authenticated AND on login/root path
      if (!hasToken || !hasUser) {
        if (window.location.pathname === '/login' || window.location.pathname === '/') {
          console.log('➡️ Redirecting to login-fast.html');
          window.location.replace('/login-fast.html');
        }
      }
      
      // Clear service workers (but NOT localStorage)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('🧹 Unregistered service worker');
          }
        });
      }
      
      // Clear caches (but NOT localStorage)
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
            console.log('🧹 Cleared cache:', name);
          }
        });
      }
      
      // Version check - but DON'T clear localStorage or force reload if authenticated
      const currentVersion = 'BUILD_TIMESTAMP';
      const storedVersion = localStorage.getItem('app_version');
      
      if (storedVersion && storedVersion !== currentVersion) {
        console.log('📦 Version changed:', storedVersion, '->', currentVersion);
        localStorage.setItem('app_version', currentVersion);
        
        // Only force reload if NOT authenticated (to avoid losing session)
        if (!hasToken || !hasUser) {
          console.log('🔄 Force reloading (not authenticated)');
          window.location.reload(true);
        } else {
          console.log('✅ Skipping force reload (authenticated)');
        }
      } else {
        localStorage.setItem('app_version', currentVersion);
      }
      
      console.log('✅ App initialization complete');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
